[package]
name = "tabflip-app"
version.workspace = true
edition.workspace = true
license.workspace = true

# The binary name is what macOS shows for a bare binary.
[[bin]]
name = "tabflip"
path = "src/main.rs"

[dependencies]
tabflip-core = { path = "../tabflip-core" }
anyhow.workspace = true
futures = "0.3"
# The zed revision is pinned in Cargo.lock (cargo update -p gpui --precise <rev>),
# the same one emaki builds against. gpui-component depends on the unpinned zed
# source, so a `rev` here would produce a second copy of gpui.
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit", "runtime_shaders"] }
gpui-component = { git = "https://github.com/longbridge/gpui-component", rev = "fd3bc2bbb8a2c4dfe268c1475682476ada54cd0c" }

# tabflip is a Mac's alone: the window list, the key tap and the switch to a
# window are all macOS calls.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSResponder", "NSView", "NSWindow", "NSPanel", "NSScreen", "NSEvent", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSGraphicsContext", "NSRunningApplication", "NSWorkspace", "NSStatusBar", "NSStatusItem", "NSStatusBarButton", "NSButton", "NSControl", "NSMenu", "NSMenuItem", "NSColor", "NSAppearance"] }
objc2-foundation = { version = "0.3", features = ["NSString", "NSArray", "NSDictionary", "NSData", "NSURL", "NSNotification", "NSGeometry", "NSValue", "NSError"] }
objc2-service-management = { version = "0.3", features = ["SMAppService"] }
raw-window-handle = "0.6"

# Installers: `cargo packager --release`. The Mac bundle is signed afterwards
# by scripts/release-mac.sh, with the identity of whoever runs it (WORKFLOW.md).
[package.metadata.packager]
productName = "tabflip"
identifier = "com.alkalinesoftware.tabflip"
description = "Switch between windows, not apps."
homepage = "https://github.com/alkaline-software/tabflip"
licenseFile = "../../LICENSE"
category = "Utility"
icons = ["assets/icon/icon.icns", "assets/icon/icon-*.png"]
outDir = "../../dist"
binaries = [{ path = "tabflip", main = true }]

[package.metadata.packager.macos]
minimumSystemVersion = "14.0"
# Merged into the bundle's Info.plist: LSUIElement, so there is no Dock icon.
infoPlistPath = "macos/Info.plist"
