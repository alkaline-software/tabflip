[workspace]
resolver = "2"
members = ["crates/tabflip-core", "crates/tabflip-app"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"

[profile.dev]
# gpui's dependency tree is huge; a little optimisation keeps the UI usable in dev.
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
strip = true
lto = "thin"
