<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tabflip README GIF</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=JetBrains+Mono:wght@400;500&display=block">
<style>
  body { margin: 0; background: #F3F1EA; }
  canvas { display: block; width: 100%; height: auto; }
</style>
</head>
<body>
<canvas id="c" width="1600" height="840"></canvas>
<script>
// The README's moving picture (docs/design.md, The README's picture), in the
// hand of the studio's sites: hairlines on warm paper, each window a pale
// wash of its color with an edge of it, a serif title and an italic serif
// line beside a mono one. Tabflip's story, all by keys: ⌘ held and Tab
// pressed shows the list of every window, the one used before chosen; Tab
// and ⇧Tab move down and up; letting go brings that window in front. A
// quick ⌘Tab goes to the last window with no list, and Esc changes nothing.
// Laid out in a 1920 by 1008 box and drawn at the canvas's size. `frame(i)`
// draws frame i at FPS and returns it as a PNG; `ready` waits for the faces
// and the icon. scripts/make-readme-gif.sh renders every frame and makes
// the GIF.

const FPS = 30, LENGTH = 12;   // seconds, looped
const W = 1920, H = 1008;
const PAPER = '#F3F1EA', SHEET = '#F8F6F0', INK = '#1F1E1D', MUTED = '#77746B', LINE = '#8E8A80';
const SAPPHIRE = '#2A69B4';
const SLATE = '#4489AE', SAGE = '#578F63', OCHRE = '#9E793D';
const SERIF = '"Source Serif 4", "Source Serif Pro", Georgia, serif';
const MONO = '"JetBrains Mono", Menlo, monospace';
const KEYS = 'system-ui, -apple-system, sans-serif';

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const icon = new Image();
// From a file the icon would taint the canvas, and no frame could be read
// back: the renderer hands it in as data (ICON).
icon.src = window.ICON || '../../crates/tabflip-app/assets/icon/icon-256.png';

window.ready = Promise.all([
  document.fonts.load(`600 84px ${SERIF}`), document.fonts.load(`400 52px ${SERIF}`),
  document.fonts.load(`italic 400 28px ${SERIF}`), document.fonts.load(`400 28px ${MONO}`),
  new Promise(r => { if (icon.complete) r(); else { icon.onload = r; icon.onerror = r; } }),
]);

const clamp01 = v => Math.min(1, Math.max(0, v));
const span = (t, t0, d) => clamp01((t - t0) / d);
function bezier(x1, y1, x2, y2) {
  const a = (p1, p2) => 1 - 3 * p2 + 3 * p1, b = (p1, p2) => 3 * p2 - 6 * p1, c = p1 => 3 * p1;
  const at = (t, p1, p2) => ((a(p1, p2) * t + b(p1, p2)) * t + c(p1)) * t;
  const slope = (t, p1, p2) => 3 * a(p1, p2) * t * t + 2 * b(p1, p2) * t + c(p1);
  return x => {
    if (x <= 0) return 0; if (x >= 1) return 1;
    let t = x;
    for (let i = 0; i < 8; i++) { const s = slope(t, x1, x2); if (Math.abs(s) < 1e-6) break; t -= (at(t, x1, x2) - x) / s; }
    return at(Math.min(1, Math.max(0, t)), y1, y2);
  };
}
const QUINT = bezier(0.23, 1, 0.32, 1);

// ---------------------------------------------------------------------------
// The screen and its windows.
// ---------------------------------------------------------------------------
const S = { x: 86, y: 322, w: 1100, h: 610, r: 24, bar: 36 };
const WINDOWS = {
  gmail: { word: 'Gmail', app: 'Google Chrome', kind: 'web', color: SLATE, r: { x: 400, y: 440, w: 520, h: 330 } },
  facebook: { word: 'Facebook', app: 'Google Chrome', kind: 'web', color: SLATE, r: { x: 200, y: 520, w: 480, h: 300 } },
  tabflip: { word: 'tabflip', app: 'Zed', kind: 'code', color: SAGE, r: { x: 600, y: 390, w: 500, h: 360 } },
  downloads: { word: 'Downloads', app: 'Finder', kind: 'files', color: OCHRE, r: { x: 130, y: 400, w: 440, h: 290 } },
};
const START = ['gmail', 'facebook', 'tabflip', 'downloads'];   // front to back

// The script, in seconds: every key and what it does. Each moment's state is
// worked out from it, so a frame can be drawn on its own.
const T = {
  down1: 1.0, tab1: 1.25, tab2: 2.2, tab3: 3.0, back: 3.8, up1: 4.8,   // a round with the list
  down2: 6.4, tab4: 6.5, up2: 6.62,                                    // a quick ⌘Tab
  down3: 8.0, tab5: 8.25, esc: 9.3, up3: 9.6,                          // a round given up
  dip: 10.6,
};
const APPEAR = 0.12, IN = 0.14, OUT = 0.11, DIP = 0.35, BACK = 0.45;

// What the round's list holds, and which row is chosen.
function round(t) {
  if (t >= T.tab1 && t < T.up1) {
    const sel = t < T.tab2 ? 1 : t < T.tab3 ? 2 : t < T.back ? 3 : 2;
    return { order: START, sel, shown: t - T.tab1, open: true };
  }
  if (t >= T.up1 && t < T.up1 + OUT) return { order: START, sel: 2, shown: 1, closing: span(t, T.up1, OUT) };
  if (t >= T.tab5 && t < T.esc) return { order: ['gmail', 'tabflip', 'facebook', 'downloads'], sel: 1, shown: t - T.tab5, open: true };
  if (t >= T.esc && t < T.esc + OUT) return { order: ['gmail', 'tabflip', 'facebook', 'downloads'], sel: 1, shown: 1, closing: span(t, T.esc, OUT) };
  return null;
}
// The windows, front to back.
function stack(t) {
  if (t < T.up1) return START;
  if (t < T.up2) return ['tabflip', 'gmail', 'facebook', 'downloads'];
  if (t < T.dip + DIP) return ['gmail', 'tabflip', 'facebook', 'downloads'];
  return START;
}
// A window just brought in front, for its edge's light.
function brought(t) {
  if (t >= T.up1 && t < T.up1 + 0.9) return ['tabflip', 1 - span(t, T.up1 + 0.3, 0.6)];
  if (t >= T.up2 && t < T.up2 + 0.9) return ['gmail', 1 - span(t, T.up2 + 0.3, 0.6)];
  return [null, 0];
}
const windowsAlpha = t => t < T.dip ? 1 : t < T.dip + DIP ? 1 - span(t, T.dip, DIP) : span(t, T.dip + DIP, BACK);

// Which keys are down.
const held = (t, k) => {
  const pressed = (at, len = 0.16) => t >= at && t < at + len;
  if (k === '⌘') return (t >= T.down1 && t < T.up1) || (t >= T.down2 && t < T.up2) || (t >= T.down3 && t < T.up3);
  if (k === '⇥') return [T.tab1, T.tab2, T.tab3, T.back, T.tab4, T.tab5].some(a => pressed(a, a === T.tab4 ? 0.1 : 0.16));
  if (k === '⇧') return t >= T.back - 0.15 && t < T.back + 0.3;
  if (k === 'esc') return pressed(T.esc);
  return false;
};

const ROWS = [
  { keys: ['⌘', '⇥'], says: 'hold: every window, in a list', on: [[T.down1, T.tab2 - 0.1]] },
  { keys: ['⇧', '⇥'], says: 'down the list, and with ⇧ up', on: [[T.tab2 - 0.1, T.up1]] },
  { word: 'let go of ⌘', says: 'that window in front', on: [[T.up1, T.up1 + 1.2]] },
  { word: 'a quick ⌘⇥', says: 'the last window, with no list', on: [[T.down2 - 0.1, T.down2 + 1.2]] },
  { keys: ['esc'], says: 'nothing changes', on: [[T.esc - 0.1, T.esc + 0.9]] },
];

// ---------------------------------------------------------------------------
// Drawing.
// ---------------------------------------------------------------------------
function rr(x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function hex(c, a) {
  const n = parseInt(c.slice(1), 16);
  return `rgba(${n >> 16}, ${(n >> 8) & 255}, ${n & 255}, ${a})`;
}
function hair(x1, y1, x2, y2, color, w = 1.6) {
  ctx.strokeStyle = color; ctx.lineWidth = w; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
}
function dot(x, y, r, color) { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); }
function words(text, x, y, font, color, align = 'left') {
  ctx.font = font; ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = 'alphabetic';
  ctx.fillText(text, x, y); ctx.textAlign = 'left';
  return ctx.measureText(text).width;
}

function header() {
  if (icon.complete && icon.naturalWidth) ctx.drawImage(icon, 78, 66, 84, 84);
  words('Tabflip', 182, 128, `400 54px ${SERIF}`, INK);
  words('for macOS', W - 86, 120, `400 30px ${MONO}`, SAPPHIRE, 'right');
  words('Switch between windows, not apps', 82, 262, `600 84px ${SERIF}`, INK);
}

// The screen with its menu bar: the app in front named at its left.
function screen(t) {
  rr(S.x, S.y, S.w, S.h, S.r); ctx.fillStyle = SHEET; ctx.fill();
  ctx.strokeStyle = LINE; ctx.lineWidth = 2; ctx.stroke();
  hair(S.x + 2, S.y + S.bar, S.x + S.w - 2, S.y + S.bar, hex(LINE, 0.55), 1.4);
  ctx.save(); ctx.globalAlpha = windowsAlpha(t);
  const front = WINDOWS[stack(t)[0]].app;
  let x = S.x + 30 + words(front, S.x + 30, S.y + 25, `600 18px ${SERIF}`, INK) + 24;
  for (const len of [30, 26, 34, 40]) { hair(x, S.y + S.bar / 2, x + len, S.y + S.bar / 2, hex(LINE, 0.7), 2); x += len + 22; }
  ctx.restore();
  hair(S.x + S.w - 112, S.y + S.bar / 2, S.x + S.w - 30, S.y + S.bar / 2, hex(LINE, 0.7), 2);
  rr(S.x + S.w - 150, S.y + 10, 20, 16, 4); ctx.strokeStyle = SAPPHIRE; ctx.lineWidth = 1.6; ctx.stroke();
  hair(S.x + S.w - 145, S.y + 15, S.x + S.w - 135, S.y + 15, SAPPHIRE, 1.6); hair(S.x + S.w - 145, S.y + 21, S.x + S.w - 135, S.y + 21, SAPPHIRE, 1.6);
}

// A window as the site sketches one: a pale wash of its color, an edge of
// it, a title bar with three dots, its content in hairlines, its name in
// its color. One behind another reads fainter.
function windowSketch(w, depth, glow) {
  const r = w.r, color = w.color;
  ctx.save();
  rr(S.x + 1, S.y + S.bar, S.w - 2, S.h - S.bar - 1, S.r); ctx.clip();
  if (depth === 0) { ctx.shadowColor = 'rgba(30, 28, 24, 0.12)'; ctx.shadowBlur = 24; ctx.shadowOffsetY = 8; }
  rr(r.x, r.y, r.w, r.h, 14); ctx.fillStyle = SHEET; ctx.fill();
  ctx.shadowColor = 'transparent';
  ctx.fillStyle = hex(color, depth === 0 ? 0.1 : 0.06); ctx.fill();
  ctx.save(); rr(r.x, r.y, r.w, r.h, 14); ctx.clip();
  const bar = 34, soft = hex(color, 0.4), faint = hex(LINE, 0.45);
  hair(r.x, r.y + bar, r.x + r.w, r.y + bar, hex(color, 0.4), 1.4);
  for (const k of [0, 1, 2]) dot(r.x + 20 + k * 15, r.y + bar / 2, 4, depth === 0 ? hex(LINE, 0.95) : hex(LINE, 0.5));
  if (w.kind === 'web') {
    rr(r.x + 90, r.y + 8, Math.min(r.w * 0.45, 230), 18, 9); ctx.strokeStyle = soft; ctx.lineWidth = 1.4; ctx.stroke();
    rr(r.x + 22, r.y + bar + 22, r.w - 44, 96, 8); ctx.stroke();
    let ly = r.y + bar + 150;
    for (const k of [0.82, 0.64, 0.74, 0.5, 0.7]) { if (ly > r.y + r.h - 40) break; hair(r.x + 22, ly, r.x + 22 + (r.w - 44) * k, ly, faint); ly += 24; }
  } else if (w.kind === 'code') {
    const side = 120;
    hair(r.x + side, r.y + bar, r.x + side, r.y + r.h, hex(color, 0.35), 1.4);
    let sy = r.y + bar + 26;
    for (const k of [0.62, 0.48, 0.7, 0.5]) { hair(r.x + 18, sy, r.x + 18 + (side - 36) * k, sy, soft, 2); sy += 26; }
    let ly = r.y + bar + 28;
    for (const [a, b] of [[0, 0.3], [0.06, 0.5], [0.12, 0.62], [0.12, 0.4], [0.06, 0.2], [0, 0.1], [0, 0.44], [0.06, 0.7], [0.12, 0.5]]) {
      if (ly > r.y + r.h - 40) break;
      hair(r.x + side + 22 + (r.w - side - 44) * a, ly, r.x + side + 22 + (r.w - side - 44) * b, ly, faint); ly += 24;
    }
  } else {
    const side = 110;
    hair(r.x + side, r.y + bar, r.x + side, r.y + r.h, hex(color, 0.35), 1.4);
    let sy = r.y + bar + 26;
    for (const k of [0.7, 0.5, 0.6]) { hair(r.x + 18, sy, r.x + 18 + (side - 36) * k, sy, soft, 2); sy += 26; }
    for (let i = 0; i < 6; i++) {
      const gx = r.x + side + 30 + (i % 3) * 96, gy = r.y + bar + 26 + Math.floor(i / 3) * 96;
      if (gy + 60 > r.y + r.h - 30) continue;
      rr(gx, gy, 50, 42, 6); ctx.strokeStyle = soft; ctx.lineWidth = 1.4; ctx.stroke();
      hair(gx + 4, gy + 58, gx + 46, gy + 58, faint);
    }
  }
  ctx.fillStyle = color; ctx.font = `400 28px ${SERIF}`; ctx.textAlign = 'right';
  ctx.fillText(w.word, r.x + r.w - 22, r.y + r.h - 20);
  ctx.textAlign = 'left';
  ctx.restore();
  rr(r.x, r.y, r.w, r.h, 14); ctx.strokeStyle = depth === 0 ? color : hex(color, 0.6); ctx.lineWidth = 2; ctx.stroke();
  if (glow > 0) { rr(r.x - 4, r.y - 4, r.w + 8, r.h + 8, 17); ctx.strokeStyle = hex(SAPPHIRE, 0.55 * glow); ctx.lineWidth = 3; ctx.stroke(); }
  ctx.restore();
}

// An app's icon, small: Chrome a ring, Zed a square, the Finder a face.
function appIcon(kind, x, y, color, onPlate) {
  const c = onPlate ? '#fff' : color;
  ctx.strokeStyle = c; ctx.lineWidth = 2;
  if (kind === 'web') { ctx.beginPath(); ctx.arc(x, y, 11, 0, Math.PI * 2); ctx.stroke(); ctx.beginPath(); ctx.arc(x, y, 4.5, 0, Math.PI * 2); ctx.stroke(); }
  else if (kind === 'code') { rr(x - 11, y - 11, 22, 22, 5); ctx.stroke(); hair(x - 5, y - 4, x + 5, y - 4, c, 2); hair(x + 5, y - 4, x - 5, y + 4, c, 2); hair(x - 5, y + 4, x + 5, y + 4, c, 2); }
  else { rr(x - 11, y - 11, 22, 22, 5); ctx.stroke(); hair(x, y - 11, x - 2, y + 11, c, 1.6); dot(x - 5, y - 3, 1.6, c); dot(x + 5, y - 3, 1.6, c); }
}

// The list: centered on the screen, lifted a little, the chosen row on the
// accent. It comes in over 140 ms once 120 have passed, and goes in 110.
function list(t) {
  const rd = round(t);
  if (!rd) return;
  let a, rise;
  if (rd.closing !== undefined) { a = 1 - rd.closing; rise = 0; }
  else { const k = QUINT(span(rd.shown, APPEAR, IN)); a = k; rise = (1 - k) * 8; }
  if (a <= 0) return;
  const rowH = 50, pad = 8, w = 470, n = rd.order.length;
  const h = n * rowH + pad * 2, x = S.x + S.w / 2 - w / 2, y = S.y + S.h * 0.42 - h / 2 + rise;
  ctx.save(); ctx.globalAlpha = a;
  ctx.shadowColor = 'rgba(30, 28, 24, 0.18)'; ctx.shadowBlur = 30; ctx.shadowOffsetY = 10;
  rr(x, y, w, h, 16); ctx.fillStyle = '#FBFBFA'; ctx.fill();
  ctx.shadowColor = 'transparent';
  ctx.strokeStyle = hex(LINE, 0.5); ctx.lineWidth = 1.4; ctx.stroke();
  rd.order.forEach((id, i) => {
    const win = WINDOWS[id], ry = y + pad + i * rowH, on = i === rd.sel;
    if (on) { rr(x + pad, ry + 2, w - pad * 2, rowH - 4, 10); ctx.fillStyle = SAPPHIRE; ctx.fill(); }
    appIcon(win.kind, x + pad + 30, ry + rowH / 2, win.color, on);
    words(win.word, x + pad + 58, ry + rowH / 2 + 8, `400 24px ${SERIF}`, on ? '#fff' : INK);
    words(win.app, x + w - pad - 18, ry + rowH / 2 + 7, `400 17px ${SERIF}`, on ? 'rgba(255,255,255,0.8)' : MUTED, 'right');
  });
  ctx.restore();
}

function key(x, y, sym, lit, down) {
  const s = 46, dy = down ? 2 : 0, wide = sym.length > 1 ? 70 : s;
  rr(x, y + dy, wide, s, 9);
  ctx.fillStyle = down ? hex(SAPPHIRE, 0.18) : SHEET; ctx.fill();
  ctx.strokeStyle = lit ? SAPPHIRE : hex(LINE, 0.9); ctx.lineWidth = lit ? 2 : 1.6; ctx.stroke();
  ctx.fillStyle = lit ? SAPPHIRE : INK; ctx.font = `500 ${sym.length > 1 ? 19 : 23}px ${KEYS}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(sym, x + wide / 2, y + s / 2 + dy + 1);
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  return wide;
}

// The keys at the right: each move, lit while it plays, a shade darker once
// it has, a cap pressed while its key is down.
function legend(t) {
  const X = 1290, Y0 = 400, STEP = 104;
  const reset = t >= T.dip ? 1 - span(t, T.dip, 0.6) : 1;
  ROWS.forEach((row, i) => {
    const lit = row.on.some(([a, b]) => t >= a && t < b);
    const begun = t >= row.on[0][0];
    const alpha = lit ? 1 : begun ? 0.36 + 0.42 * reset : 0.36;
    const y = Y0 + i * STEP;
    ctx.save(); ctx.globalAlpha = alpha;
    if (row.keys) { let kx = X; row.keys.forEach(k => { kx += key(kx, y - 34, k, lit, lit && held(t, k)) + 10; }); }
    else words(row.word, X, y, `400 28px ${MONO}`, lit ? SAPPHIRE : INK);
    words(row.says, X + 200, y, `italic 400 28px ${SERIF}`, lit ? INK : MUTED);
    ctx.restore();
  });
}

function draw(t) {
  ctx.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0);
  ctx.fillStyle = PAPER; ctx.fillRect(0, 0, W, H);
  header();
  screen(t);
  const order = stack(t), [lit, glow] = brought(t);
  ctx.save(); ctx.globalAlpha = windowsAlpha(t);
  for (let i = order.length - 1; i >= 0; i--) windowSketch(WINDOWS[order[i]], i, order[i] === lit ? glow : 0);
  ctx.restore();
  list(t);
  legend(t);
}

window.frame = i => { draw(i / FPS); return canvas.toDataURL('image/png'); };
window.FRAMES = FPS * LENGTH;
window.FPS = FPS;
window.ready.then(() => {
  // In a browser, the picture plays; the renderer draws frame by frame.
  if (!navigator.webdriver && !window.RENDERING) {
    const start = performance.now();
    const tick = now => { draw(((now - start) / 1000) % LENGTH); requestAnimationFrame(tick); };
    requestAnimationFrame(tick);
  }
});
</script>
</body>
</html>
